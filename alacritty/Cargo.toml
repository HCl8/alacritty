[package]
name = "alacritty"
version = "0.18.0-dev"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "A fast, cross-platform, OpenGL terminal emulator"
readme = "README.md"
homepage = "https://alacritty.org"
repository = "https://github.com/alacritty/alacritty"
edition.workspace = true
rust-version.workspace = true

[dependencies.alacritty_terminal]
path = "../alacritty_terminal"
version = "0.26.1-dev"

[dependencies.alacritty_config_derive]
path = "../alacritty_config_derive"
version = "0.2.6-dev"

[dependencies.alacritty_config]
path = "../alacritty_config"
version = "0.2.4-dev"

[dependencies]
ahash = { version = "0.8.6", features = ["no-rng"] }
bitflags = "2.2.1"
clap = { version = "4.2.7", features = ["derive", "env"] }
copypasta = { version = "0.10.1", default-features = false }
crossfont = "0.8.1"
glutin = { version = "0.32.2", default-features = false, features = ["egl", "wgl"] }
home = "0.5.5"
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
notify = "8.0.0"
parking_lot = "0.12.0"
polling = "3.11.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.25"
signal-hook = { version = "0.4.3", default-features = false }
tempfile = "3.12.0"
toml.workspace = true
toml_edit.workspace = true
unicode-width = "0.2.0"
winit = { git = "https://github.com/HCl8/winit", branch = "local-ime-fix", default-features = false, features = ["rwh_06", "serde"] }

[build-dependencies]
gl_generator = "0.14.0"

[dev-dependencies]
clap_complete = "4.2.3"

[target.'cfg(not(windows))'.dependencies]
xdg = "3.0.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = { version = "0.17.5", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSString",
    "NSLocale",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
dirs = "6.0.0"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
]}

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.2"

[features]
default = ["wayland", "x11"]
x11 = [
    "copypasta/x11",
    "winit/x11",
    "glutin/x11",
    "glutin/glx",
    "png",
]
wayland = [
    "copypasta/wayland",
    "glutin/wayland",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita-crossfont",
]
nightly = []

[package.metadata.deb]
maintainer = "Alacritty Contributors"
copyright = "2016-2026 Alacritty Contributors"
license-file = ["../LICENSE-APACHE", "4"]
extended-description = "Alacritty is a modern terminal emulator that comes with sensible defaults, but allows for extensive configuration. By integrating with other applications, rather than reimplementing their functionality, it manages to provide a flexible set of features with high performance."
depends = "$auto, ncurses-term"
section = "x11"
priority = "optional"
assets = [
    ["target/release/alacritty", "usr/bin/", "755"],
    ["../extra/linux/Alacritty.desktop", "usr/share/applications/", "644"],
    ["../extra/linux/org.alacritty.Alacritty.appdata.xml", "usr/share/metainfo/", "644"],
    ["../extra/logo/alacritty-term.svg", "usr/share/pixmaps/Alacritty.svg", "644"],
    ["../extra/completions/alacritty.bash", "usr/share/bash-completion/completions/alacritty", "644"],
    ["../extra/completions/alacritty.fish", "usr/share/fish/vendor_completions.d/alacritty.fish", "644"],
    ["../extra/completions/_alacritty", "usr/share/zsh/vendor-completions/_alacritty", "644"],
    ["../extra/man/alacritty.1.gz", "usr/share/man/man1/alacritty.1.gz", "644"],
    ["../extra/man/alacritty-msg.1.gz", "usr/share/man/man1/alacritty-msg.1.gz", "644"],
    ["../extra/man/alacritty.5.gz", "usr/share/man/man5/alacritty.5.gz", "644"],
    ["../extra/man/alacritty-bindings.5.gz", "usr/share/man/man5/alacritty-bindings.5.gz", "644"],
    ["../extra/man/alacritty-escapes.7.gz", "usr/share/man/man7/alacritty-escapes.7.gz", "644"],
]
